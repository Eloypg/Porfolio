name: CI/CD

# `push: branches: [main]` ya cubre tanto los push directos como el push que
# GitHub genera al mergear un PR hacia main, así que no hace falta un
# trigger adicional de tipo `pull_request: types: [closed]` para detectar merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: npx --yes html-validate@8 index.html

      - name: Check for broken links
        # linkedin.com bloquea peticiones automatizadas (responde 999), no es un enlace roto real
        run: npx --yes linkinator@6 index.html --recurse --skip "linkedin.com"

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
